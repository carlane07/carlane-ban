<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARLANE | Ban Tool</title>
    <style>
    /* --- RESET & BASE --- */
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { color: white; }

    /* --- EFFET MATRIX V2 (Plus fluide et dynamique) --- */
   #matrix-canvas {
    position: fixed; top: 0; left: 0; z-index: -1;
    opacity: 0.8;
  }

    /* --- CENTRALISATION --- */
  .main-container {
    display: flex; flex-direction: column; align-items: center; 
    justify-content: center; height: 100vh;
    position: relative; z-index: 10;
  }

    /* --- HEADER & SOCLE --- */
   header {
    text-align: center; margin-bottom: 30px;
    animation: glowText 2s infinite alternate;
  }

  .logo-ring {
    width: 160px; height: 160px; margin: 0 auto 20px;
    border-radius: 50%;
    position: relative;
  }

  .logo-ring::after {
    content: ' ';
    position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
    border-radius: 50%; border: 4px solid transparent;
    border-top-color: #00f260; 
    border-right-color: #0575e6;
    animation: spin 3s linear infinite;
  }

    /* --- IMAGE --- */
  .profile-pic {
    width: 140px; height: 140px; 
    border-radius: 50%; 
    object-fit: cover;
    border: 4px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 20px #00f260, 0 0 40px #0575e6;
    background: linear-gradient(135deg, #00f260, #0575e6);
    position: absolute; top: 10px; left: 10px;
    z-index: 2;
  }

   h1 {
    font-size: 3rem; margin: 0; 
    background: linear-gradient(90deg, #00f260, #0575e6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(0, 242, 96, 0.5);
    font-weight: 800; letter-spacing: -1px;
  }

   .subtitle { font-size: 1rem; color: #ccc; letter-spacing: 3px; text-transform: uppercase; margin-top: 5px; }

    /* --- BAN INPUT (Style Glassmorphism) --- */
  .ban-interface {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    padding: 30px 50px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 
    0 0 15px rgba(5, 117, 230, 0.2);
    display: flex; flex-direction: column; gap: 20px;
    width: 90%; max-width: 450px;
    position: relative;
    overflow: hidden;
  }

    /* Lueur de fond dans la boîte */
  .ban-interface::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
    background: linear-gradient(90deg, #00f260, #0575e6);
  }

   input[type="tel"] {
    width: 100%; 
    background: rgba(0, 0, 0, 0.6);
    border: 2px solid #333;
    color: #fff;
    padding: 15px; 
    font-size: 1.2rem;
    border-radius: 10px;
    outline: none;
    transition: 0.3s;
    text-align: center;
    text-transform: uppercase;
    font-weight: bold;
    letter-spacing: 2px;
  }

   input[type="tel"]:focus {
    border-color: #00f260;
    box-shadow: 0 0 15px rgba(0, 242, 96, 0.3);
  }

    /* --- BUTTONS --- */
  .btn-ban {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
   }
  .btn-ban:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 10px 20px rgba(0, 242, 96, 0.4);
  }

  .btn-chaîne {
    margin-top: 15px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(5, 117, 230, 0.5);
    padding: 12px 20px;
    color: #a2d9ff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    transition: 0.3s;
   }
  .btn-chaîne:hover {
    background: rgba(5, 117, 230, 0.2);
    color: white;
    border-color: white;
    box-shadow: 0 0 15px rgba(5, 117, 230, 0.4);
  }

    /* --- INPUT DE SÉLECTION DE PAYS (Ajouté) --- */
   .input-group { position: relative; }
  .country-code {
    position: absolute; left: 15px; top: 50%;
    transform: translateY(-50%);
    color: #aaa;
    font-weight: bold;
    font-size: 1.1rem;
  }

    /* --- STATUS (Log terminal style) --- */
  .log-terminal {
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    color: #00ff41;
    min-height: 20px;
    text-shadow: 0 0 5px #00ff41;
  }

    /* --- ANIMATIONS --- */
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes glowText { 0% { text-shadow: 0 0 10px rgba(0, 242, 96, 0.2); } 100% { text-shadow: 0 0 30px rgba(0, 242, 96, 0.8); } }
    </style>
</head>
<body>

    <!-- CANVAS EFFET MATRIX -->
    <canvas id="matrix-canvas"></canvas>

    <!-- INTERFACE -->
    <div class="main-container">
    <header>
    <div class="logo-ring">
    <!-- Vérifie que t'as bien l'image 'votre-image.jpg' dans le même dossier -->
    <img src="votre-image.jpg" alt="Avatar" class="profile-pic">
    </div>
    <h1>CARLANE</h1>
    <div class="subtitle">Advanced Ban System</div>
   </header>

    <div class="ban-interface">
    <div class="input-group">
    <!-- FORMAT 001 / +241 comme demandé -->
    <span class="country-code">+241</span>
    <input type="tel" id="phone" placeholder="××××××××" autocomplete="off">
   </div>

    <button onclick="startBan()" class="btn-ban">
    <span style="margin-right: 8px;">⚡</span> ACTIVER LE BAN
   </button>

    <div id="status-log" class="log-terminal">> System ready...</div>
   </div>

    <!-- BOUTON REJOINDRE CHAÎNE -->
    <a href="https://whatsapp.com/channel/0029VbDgE40BFLgaySZtWp17" target="_blank" class="btn-chaîne">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0.16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
    Rejoindre la Chaîne
    </a>
   </div>

    <script>
    // --- EFFET MATRIX (PDF/V2) ---
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const letters = "01XYZABCDEFGHIJKLMNOPQRSTUVWXYZ@";
    const fontSize = 18;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    const colors = ["#00FF41", "#008F11", "#FFFFFF"];

    function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
    const text = letters.charAt(Math.floor(Math.random() * letters.length));
    // Couleur aléatoire pour effet vibrant
    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
    drops[i] = 0;
   }
    drops[i]++;
   }
   }
    setInterval(drawMatrix, 33);

    // --- LOGIQUE BAN PROFESSIONNELLE ---
    function startBan() {
    const input = document.getElementById('phone');
    const status = document.getElementById('status-log');
    const num = input.value;

    if (!num) {
    status.innerText = "> Erreur: Entrez un numéro valide. (Format: ×××××××××)";
    status.style.color = "#ff4d4d";
    input.style.borderColor = "#ff4d4d";
    setTimeout(() => {
    input.style.borderColor = "#333";
    status.style.color = "#00ff41";
    }, 2000);
    return;
  }

    input.style.borderColor = "#00FF41";
  
    // Simulation processus rapide
    status.innerText = "> Connexion au serveur CARLANE...";
  
    setTimeout(() => { status.innerText = "> Analyse du réseau GSM..."; }, 800);
    setTimeout(() => { status.innerText = "> Injection du signal de blocage..."; }, 1600);
    setTimeout(() => { 
    status.innerText = "> SUCCESS: Numéro +241 " + num + " Banni!";
    status.style.color = "#ff4d4d";
    status.style.textShadow = "0 0 10px red";
    input.value = "0";
    input.placeholder = "Banni";
  
    // Reset après 3 sec
    setTimeout(() => {
    input.value = "";
    input.placeholder = "××××××××";
    status.innerText = "> System ready...";
    status.style.color = "#00ff41";
    status.style.textShadow = "0 0 5px #00ff41";
    }, 3000);
    }, 2400);
   }
  
    // Gestion du resize pour l'écran responsive
    window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
   });
    </script>
</body>
</html>
